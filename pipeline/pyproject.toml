[project]
name = "ariadne-pipeline"
version = "1.0.0"
description = "ARIADNE Stage 1: turns NASA Mars data into the local-grid files the app reads (see docs/contracts.md)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3.9",
    "pyproj>=3.6",
    "scikit-image>=0.22",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
